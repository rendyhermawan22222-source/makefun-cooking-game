<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Warung Rush — game masak warung malam</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #141830; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #game { display: block; width: min(100vw, 266.67vh); height: min(100vh, 37.5vw); touch-action: none; image-rendering: auto; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="480" aria-label="Warung Rush: jalankan warung malam, masak pesanan dan sajikan sebelum pelanggan kabur"></canvas>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
